# Copy this file, fill in the values, and **never commit the copy**.
#
# It is an example, not a manifest to apply: committing a Secret with real values
# puts the credential in git history, where deleting the file later does not remove
# it. The live Secret is created from the command line:
#
#   kubectl create secret generic backend-secrets \
#     -n investment-portfolio-manager \
#     --from-literal=OIDC_CLIENT_SECRET='<from Authentik>' \
#     --from-literal=ROCKET_SECRET_KEY="$(openssl rand -base64 32)"
#
# `openssl rand -base64 32` produces 44 base64 characters decoding to 32 bytes,
# which is what Rocket 0.5 accepts (44 or 88 base64 characters, or 64 hex; fewer
# than 32 decoded bytes is rejected). A shorter key does not fail quietly — the
# backend refuses to launch.
#
# ROCKET_SECRET_KEY must be **stable across restarts**. Rotating it invalidates
# every session cookie at once, which forces everyone to sign in again; that is a
# re-login, not data loss, but it is not something to do by accident.
#
# The Secret must exist before the deployment rolls out. A missing Secret means the
# pod does not start, which is the intended failure: booting with an ephemeral key
# would silently invalidate every existing session on the next restart.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: investment-portfolio-manager
type: Opaque
stringData:
  # The Authentik application's client secret.
  OIDC_CLIENT_SECRET: "REPLACE_ME"
  # Generates the session cookie's AEAD key. Keep it private and keep it stable.
  ROCKET_SECRET_KEY: "REPLACE_ME_WITH_openssl_rand_base64_32"
