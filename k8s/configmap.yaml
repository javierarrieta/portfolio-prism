apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: investment-portfolio-manager
data:
  DATABASE_URL: "sqlite:///app/data/portfolio.db?mode=rwc"

  # Authentication. `oidc` is the only value the release image accepts: the
  # `disabled` variant is compiled out of the release profile, so this is not a
  # switch that can be flipped back in an emergency. Rolling back an auth change
  # means rolling back the image revision, not editing this file.
  AUTH_MODE: "oidc"

  # Non-secret OIDC configuration. The client secret is NOT here — it lives in the
  # `backend-secrets` Secret (see secret.example.yaml).
  OIDC_ISSUER: "https://auth.example.com/application/o/portfolio-prism"
  OIDC_CLIENT_ID: "portfolio-prism"
  # Must match a redirect URI registered on the Authentik provider, and must be the
  # public HTTPS origin the browser actually reaches — it is what the IdP sends the
  # browser back to, so a value that does not match fails at the IdP with no local
  # diagnostic.
  OIDC_REDIRECT_URI: "https://portfolio.example.com/auth/callback"
  # The Authentik `sub` of the person who should inherit every pre-existing
  # portfolio. Read it from the Authentik admin console before deploying: rows that
  # have no owner and no bootstrap target make the backend refuse to start, which is
  # the intended outcome rather than guessing an owner.
  #
  # A blank value here counts as unset, exactly as an absent one does.
  BOOTSTRAP_OWNER_SUBJ: "REPLACE_WITH_AUTHENTIK_SUB"

  # Deliberately absent:
  #   ROCKET_PROFILE — the release image resolves to the `release` profile on its
  #     own, and Rocket's own secret-key check is what proves ROCKET_SECRET_KEY is
  #     present. Setting the profile here would only create a way to get it wrong.
  #   post_logout_redirect_uri — derived in code from OIDC_REDIRECT_URI, so it
  #     cannot drift from it. It still has to be registered on the provider.
