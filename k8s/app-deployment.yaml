apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: investment-portfolio-manager
  labels:
    app: investment-portfolio-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: investment-portfolio-manager
  template:
    metadata:
      labels:
        app: investment-portfolio-manager
    spec:
      # No initContainer waiting for the backend. The previous one curled
      # `http://127.0.0.1:8000/` from an init phase, which runs **before** the
      # backend container exists, so it could only ever exhaust its retries and
      # exit 1 — it delayed every pod start by 60 seconds and could never succeed.
      # The backend's own readiness probe is what gates traffic, and it already
      # exists below.
      containers:
        - name: frontend
          image: ghcr.io/<org>/investment-portfolio-manager/frontend:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
        - name: backend
          image: ghcr.io/<org>/investment-portfolio-manager/backend:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            # ROCKET_SECRET_KEY and OIDC_CLIENT_SECRET. The Secret must exist before
            # rollout; with it missing the pod fails to start rather than booting
            # with an ephemeral key that would invalidate every session on restart.
            - secretRef:
                name: backend-secrets
          env:
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: database
              mountPath: /app/data
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: postgresql-db-pvc
