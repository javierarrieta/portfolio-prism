apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: investment-portfolio-manager
  labels:
    app: investment-portfolio-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: investment-portfolio-manager
  template:
    metadata:
      labels:
        app: investment-portfolio-manager
    spec:
      # No initContainer waiting for the backend. The previous one curled
      # `http://127.0.0.1:8000/` from an init phase, which runs **before** the
      # backend container exists, so it could only ever exhaust its retries and
      # exit 1 — it delayed every pod start by 60 seconds and could never succeed.
      # The backend's own readiness probe is what gates traffic, and it already
      # exists below.
      containers:
        - name: frontend
          image: ghcr.io/<org>/investment-portfolio-manager/frontend:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
        - name: backend
          # Pinned by digest, not `:latest`. The rollback story for an auth change is
          # "roll back the image revision" — `AUTH_MODE=disabled` is not compiled
          # into the release image, so no environment variable can undo a bad auth
          # deploy. `kubectl rollout undo` on a `:latest` tag is a no-op: the pod
          # template is byte-identical, so nothing rolls out and the restart pulls
          # whatever is published today. Record the digest you deployed before you
          # deploy it, or the rollback does not exist.
          image: ghcr.io/<org>/investment-portfolio-manager/backend@sha256:REPLACE_WITH_DIGEST
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            # ROCKET_SECRET_KEY and OIDC_CLIENT_SECRET. The Secret must exist before
            # rollout; with it missing the pod fails to start rather than booting
            # with an ephemeral key that would invalidate every session on restart.
            - secretRef:
                name: backend-secrets
          env:
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # `init_db` now runs ALTERs and a full-table ownership backfill before
          # Rocket binds the port. On a large database that is longer than the
          # liveness `initialDelaySeconds`, so without a startup probe the kubelet
          # kills the container mid-migration and it restarts into the same work.
          startupProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: database
              mountPath: /app/data
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: postgresql-db-pvc
