name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  packages: write

jobs:
  backend-build-amd64:
    runs-on: ubuntu-latest
    # Every job here gets a cap, because the default is 6 h and a stalled release job is worse
    # than a failed one. Cutting v0.0.6-M5, `frontend-build` produced *zero* log bytes for 2h47m
    # — the log blob did not exist — which is indistinguishable from "still building" from the
    # outside, and it held a runner the whole time. A rerun of the same job took 7m29s.
    # 30 min is ~3x the worst healthy observation: backend ~4m, frontend 10m19s cold in ci.yml
    # and 7m29s here. Failing at 30 turns a silent multi-hour stall into a red job and an
    # obvious rerun.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend (amd64)
        uses: docker/build-push-action@v7
        with:
          context: backend_rust
          file: backend_rust/Dockerfile
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.version.outputs.VERSION }}-amd64

  backend-build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend (arm64)
        uses: docker/build-push-action@v7
        with:
          context: backend_rust
          file: backend_rust/Dockerfile
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.version.outputs.VERSION }}-arm64

  backend-manifest:
    needs: [backend-build-amd64, backend-build-arm64]
    runs-on: ubuntu-latest
    # Two `imagetools create` calls; observed 5 s. The cap is here so no job in this file is
    # left running on the 6 h default.
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          docker buildx imagetools create -t "ghcr.io/${{ github.repository }}/backend:${VERSION}" \
            "ghcr.io/${{ github.repository }}/backend:${VERSION}-amd64" \
            "ghcr.io/${{ github.repository }}/backend:${VERSION}-arm64"
          docker buildx imagetools create -t "ghcr.io/${{ github.repository }}/backend:latest" \
            "ghcr.io/${{ github.repository }}/backend:${VERSION}-amd64" \
            "ghcr.io/${{ github.repository }}/backend:${VERSION}-arm64"

  # Split per architecture on native runners (#59), mirroring the backend jobs above.
  # The single multi-platform job this replaces built arm64 under QEMU user-mode
  # emulation and is the least reliable job in the repository: cutting v0.0.6-M5 it
  # produced zero log bytes for 2h47m, and it did the same again on a backend-only PR.
  # Under emulation every `node`, `npm` and native-addon binary is interpreted, so a
  # transient network blip in `npm ci` becomes a timeout a native build outruns, and a
  # wedged emulated process produces no output at all.
  frontend-build-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push frontend (amd64)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          # Scoped per architecture so the two legs do not write the same cache entry.
          cache-from: type=gha,scope=frontend-amd64
          cache-to: type=gha,mode=max,scope=frontend-amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.version.outputs.VERSION }}-amd64

  frontend-build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push frontend (arm64)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/arm64
          cache-from: type=gha,scope=frontend-arm64
          cache-to: type=gha,mode=max,scope=frontend-arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.version.outputs.VERSION }}-arm64

  frontend-manifest:
    needs: [frontend-build-amd64, frontend-build-arm64]
    runs-on: ubuntu-latest
    # Two `imagetools create` calls; the backend equivalent is observed at 5 s.
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          docker buildx imagetools create -t "ghcr.io/${{ github.repository }}/frontend:${VERSION}" \
            "ghcr.io/${{ github.repository }}/frontend:${VERSION}-amd64" \
            "ghcr.io/${{ github.repository }}/frontend:${VERSION}-arm64"
          docker buildx imagetools create -t "ghcr.io/${{ github.repository }}/frontend:latest" \
            "ghcr.io/${{ github.repository }}/frontend:${VERSION}-amd64" \
            "ghcr.io/${{ github.repository }}/frontend:${VERSION}-arm64"
