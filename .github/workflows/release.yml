name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  packages: write

jobs:
  backend-build-amd64:
    runs-on: ubuntu-latest
    # Every job here gets a cap, because the default is 6 h and a stalled release job is worse
    # than a failed one. Cutting v0.0.6-M5, `frontend-build` produced *zero* log bytes for 2h47m
    # — the log blob did not exist — which is indistinguishable from "still building" from the
    # outside, and it held a runner the whole time. A rerun of the same job took 7m29s.
    # 30 min is ~3x the worst healthy observation: backend ~4m, frontend 10m19s cold in ci.yml
    # and 7m29s here. Failing at 30 turns a silent multi-hour stall into a red job and an
    # obvious rerun.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend (amd64)
        uses: docker/build-push-action@v7
        with:
          context: backend_rust
          file: backend_rust/Dockerfile
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.version.outputs.VERSION }}-amd64

  backend-build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend (arm64)
        uses: docker/build-push-action@v7
        with:
          context: backend_rust
          file: backend_rust/Dockerfile
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.version.outputs.VERSION }}-arm64

  backend-manifest:
    needs: [backend-build-amd64, backend-build-arm64]
    runs-on: ubuntu-latest
    # Two `imagetools create` calls; observed 5 s. The cap is here so no job in this file is
    # left running on the 6 h default.
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          docker buildx imagetools create -t "ghcr.io/${{ github.repository }}/backend:${VERSION}" \
            "ghcr.io/${{ github.repository }}/backend:${VERSION}-amd64" \
            "ghcr.io/${{ github.repository }}/backend:${VERSION}-arm64"
          docker buildx imagetools create -t "ghcr.io/${{ github.repository }}/backend:latest" \
            "ghcr.io/${{ github.repository }}/backend:${VERSION}-amd64" \
            "ghcr.io/${{ github.repository }}/backend:${VERSION}-arm64"

  frontend-build:
    runs-on: ubuntu-latest
    # The job that stalled for 2h47m with no log. 30 min, see the note on backend-build-amd64.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/frontend:latest
