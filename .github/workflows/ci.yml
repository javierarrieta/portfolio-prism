name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Observed 1-2 min on main. A cap is not here to police slow builds; it is here
    # because an uncapped job that stalls produces no log and reads as still running
    # for six hours. Same reasoning as the release-workflow caps.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Tests
        run: |
          cd backend_rust
          cargo test

      - name: Clippy
        # `AGENTS.md` ("Backend gates") and `docs/auth-testing.md` both list this as a
        # backend gate, and no job ran it, so the documented gate list and the enforced
        # one had different contents: a lint that fails on someone's machine shipped
        # green. The command is the one the docs give rather than
        # `cargo clippy --all-targets -- -D warnings`, because the tree has pre-existing
        # warnings (deprecated `rocket::http::CookieBuilder::finish` in the auth tests,
        # dead_code in others) and silencing those is a change to the gate, not a step
        # to add here. What this step makes impossible is a clippy *error* reaching main.
        run: |
          cd backend_rust
          cargo clippy --all-targets

      - name: Pricing-seam gate
        # Static rule: no test may construct a pricing service pointed at the live
        # provider. The suite used to make 21 outbound calls per run and still passed
        # — the failure mode a green check cannot see. The script documents why the
        # rule is static rather than a grep over test output.
        run: bash backend_rust/scripts/check_pricing_seam.sh

      - name: Access-control gate
        # Static rules over the handler surface. Prints what it inspected, so a
        # gate that silently matched nothing fails instead of passing.
        run: bash backend_rust/scripts/check_access_gate.sh

      - name: Generate and Validate OpenAPI Spec
        run: |
          # `--print-openapi` exits before reading configuration, the database, or
          # the network, so this needs no dummy portfolio.db, no background server,
          # no sleep, and no kill. The previous version of this step started the
          # real server, which since the auth work refuses to launch without OIDC
          # configuration — the gate would have been checking nothing.
          cd backend_rust
          cargo run --bin backend_rust -- --print-openapi > /tmp/current_openapi.json
          diff /tmp/current_openapi.json ../docs/openapi/openapi.json || (echo "OpenAPI spec has changed! Please update docs/openapi/openapi.json" && exit 1)

      - name: Backup schema is up to date
        run: |
          # Same contract as the OpenAPI diff above: `--print-backup-schema` exits
          # before reading configuration, the database, or the network, so this
          # needs no portfolio.db, no OIDC configuration, and no running server.
          # The artifact had only an in-tree drift guard, so a commit that skipped
          # `cargo test` could ship a stale v1.json and CI would not notice.
          cd backend_rust
          cargo run --bin backend_rust -- --print-backup-schema > /tmp/current_backup_schema.json
          diff /tmp/current_backup_schema.json ../docs/backup-schema/v1.json \
            || (echo "Backup schema has changed! Regenerate docs/backup-schema/v1.json" && exit 1)

      - name: Backup module stays engine-portable
        # Static rules over `src/backup/`, in the style of the access gate above.
        # This is what the engine-selection spec leans on: it is the reason that
        # spec's share of the work is a mechanical change to this module rather
        # than a rewrite. The script prints what it inspected, and
        # tests/backup_portability_test.rs runs it against throwaway trees that
        # must fail, so the gate cannot rot into decoration.
        run: bash backend_rust/scripts/check_backup_portability.sh

  release-build:
    # Compiles the release binary with `AuthMode::Disabled` compiled out, and then
    # actually runs it to prove the runtime refusal. The refusal is behind
    # `!cfg!(debug_assertions)`, so no `cargo test` in the debug profile can reach
    # it and the claim would otherwise be unverified. `cargo test --release` is
    # deliberately not used: the integration tests need the `Disabled` variant and
    # do not compile without it.
    # Observed 2-3 min on main, which is a full release compile of the backend.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release
        working-directory: backend_rust

      - name: Release binary refuses AUTH_MODE=disabled
        # Exit 1 and a message naming the variable. Anything else — a clean start, a
        # panic, or a silent exit 0 — means the release image can be talked into
        # running with no authentication, which is the one configuration that must be
        # impossible to reach by environment alone.
        run: |
          set +e
          out=$(AUTH_MODE=disabled ./target/release/backend_rust 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "release binary started with AUTH_MODE=disabled; it must refuse"; exit 1
          fi
          echo "$out" | grep -q "AUTH_MODE=disabled" || { echo "refusal did not name AUTH_MODE"; exit 1; }
        working-directory: backend_rust

      - name: Release binary refuses a missing OIDC configuration
        run: |
          set +e
          out=$(AUTH_MODE=oidc ./target/release/backend_rust 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then echo "release binary started with no OIDC configuration"; exit 1; fi
          for v in OIDC_ISSUER OIDC_CLIENT_ID OIDC_CLIENT_SECRET OIDC_REDIRECT_URI; do
            echo "$out" | grep -q "$v" || { echo "refusal did not name $v"; exit 1; }
          done
        working-directory: backend_rust

  frontend-tests:
    runs-on: ubuntu-latest
    # Observed 1 min on main.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        # v4 runs the action itself on Node 20, which GitHub is retiring; the runner
        # prints a warning annotation on every frontend job because of it. v7 targets
        # Node 24 and takes the same inputs used here (`node-version`, `cache`,
        # `cache-dependency-path`). This is the action's runtime, not the app's —
        # `node-version: '20'` below stays, because frontend/Dockerfile builds on
        # node:20-alpine and CI must keep matching the image it tests.
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Generate API types
        run: npm run generate-types
        working-directory: frontend

      - name: Generated API types are committed
        # `openapi.json` is diffed above; this is the other generated artifact and it
        # had no freshness check, so a commit could leave `api.d.ts` stale against the
        # spec and CI would never notice. It has zero importers, so nothing else can
        # catch the drift either.
        run: git diff --exit-code frontend/src/types/api.d.ts

      - name: Auth proxy is configured
        # Both proxy files sit outside every test suite, so a missing `/auth` rule
        # only shows up as a login that silently loops in production. Grep is the
        # cheapest thing that can notice.
        run: |
          grep -q 'location /auth' frontend/nginx.conf || { echo "frontend/nginx.conf has no 'location /auth' block: /auth/login would serve index.html and login would loop"; exit 1; }
          grep -q "'/auth'" frontend/vite.config.js || { echo "frontend/vite.config.js has no '/auth' proxy: ./start.sh cannot complete a login"; exit 1; }

      - name: Typecheck
        # `vite build` strips types without checking them, so without this step nothing in
        # CI ever ran tsc and the test files were never type-checked at all.
        run: npm run typecheck
        working-directory: frontend

      - name: Lint
        # The plan's own gate list, and the reason the local check and CI cannot
        # diverge. Without it a lint error ships and only shows up on someone's
        # machine.
        run: npm run lint
        working-directory: frontend

      - name: Run tests
        run: npm test
        working-directory: frontend

  e2e-smoke:
    # The only layer in the repo that drives a real browser against the real Rocket API and a
    # real SQLite file. jsdom mocks the endpoint it would need to get wrong; cargo tests render
    # nothing. See frontend/e2e/README.md.
    #
    # Blocking on purpose. A `continue-on-error` job reads as coverage while checking nothing,
    # which is worse than no job at all.
    #
    # Boots the whole stack twice, once per smoke, because each `run.sh` invocation owns its own
    # throwaway database, backend and vite. The second boot is cheap: the binary is already
    # compiled. The statement step is deliberately *not* `if: always()` — if the sell-pnl run
    # could not even start the backend, the statement run would burn another 420 s proving it
    # could not either.
    #
    # No cargo cache, deliberately. The first run of this job built the crate from nothing in
    # ~86 s and finished in 3m15s, so a cache would save about a minute while storing 504 MB
    # against the 10 GB per-repo budget shared with every other key, and paying ~6 s to save on
    # every run. `build-and-test` caches nothing either. Revisit only if the cold build stops
    # being the cheap part.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        # v7 for the action's own runtime, for the reason recorded on `frontend-tests`. The app
        # stays on Node 20 because frontend/Dockerfile builds on node:20-alpine and this job has
        # to match the image it is testing.
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install chromium
        # `playwright-core` ships the browser downloader but — unlike `playwright` — has no
        # postinstall that runs it, so the job has to ask for a browser explicitly. No
        # `--only-shell`: both smokes launch a full browser with `--no-sandbox
        # --disable-dev-shm-usage`, and the headless shell is not interchangeable for that.
        # `--with-deps` also pulls the distro font packages, which is what stops currency
        # symbols rendering as tofu in the statement PDF. It needs sudo; GitHub-hosted runners
        # have passwordless sudo.
        working-directory: frontend
        run: |
          npx playwright-core install --with-deps chromium
          # `run.sh` is a separate step and dies with "no chromium binary found" unless it sees
          # CHROMIUM or a chromium on PATH, so the resolved path goes into $GITHUB_ENV rather
          # than being exported here.
          echo "CHROMIUM=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Sell P&L smoke
        working-directory: frontend
        env:
          SMOKE_SHOT: /tmp/e2e-sell-pnl.png
          SMOKE_LOG_DIR: /tmp/e2e-logs/sell-pnl
        run: npm run e2e:sell-pnl

      - name: Printable statement smoke
        working-directory: frontend
        env:
          SMOKE_SHOT: /tmp/e2e-statement.png
          SMOKE_LOG_DIR: /tmp/e2e-logs/statement
        run: npm run e2e:statement

      - name: Upload screenshots and server logs
        # always(): both smokes write SMOKE_SHOT on the success path too, and a red run is the
        # one you actually need the logs for. `if-no-files-found: ignore` so a smoke that died
        # before it could shoot does not fail the upload of everything that did.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke
          path: |
            /tmp/e2e-sell-pnl.png
            /tmp/e2e-statement.png
            /tmp/e2e-logs
          if-no-files-found: ignore

  docker-build-backend:
    runs-on: ubuntu-latest
    # Observed 0-5 min on main; the cold build is the 5 min one. Matches the
    # release workflow's backend cap.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend (amd64)
        uses: docker/build-push-action@v7
        with:
          context: backend_rust
          file: backend_rust/Dockerfile
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false

  # Split per architecture on native runners (#59). The single multi-platform job this
  # replaces built arm64 under QEMU user-mode emulation, where every `node`, `npm` and
  # native-addon binary is interpreted. That leg stalled four times in one day — twice
  # producing zero log bytes for 30+ minutes, once on a backend-only PR where nothing in
  # `frontend/` had changed, and once as an `npm ci` ETIMEDOUT that a native build
  # outruns. `docker-build-backend` above is amd64-only, so this is the first time the
  # frontend gets the native-ARM runner the release workflow already uses.
  #
  # Build-only, like the backend job: PR runs get no registry credentials, so there is no
  # manifest to push and no manifest job here. The published multi-arch image is
  # assembled in release.yml.
  docker-build-frontend-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frontend (amd64)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          # Scoped per architecture. Two jobs in one workflow sharing the default `gha`
          # cache scope write to the same cache entry; scoping is how buildx says "this
          # leg has its own cache". Costs one cold build, then each arch caches properly
          # instead of contending.
          cache-from: type=gha,scope=frontend-amd64
          cache-to: type=gha,mode=max,scope=frontend-amd64
          push: false

  docker-build-frontend-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frontend (arm64)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/arm64
          cache-from: type=gha,scope=frontend-arm64
          cache-to: type=gha,mode=max,scope=frontend-arm64
          push: false
