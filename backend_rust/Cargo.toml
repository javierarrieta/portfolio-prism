[package]
name = "backend_rust"
version = "0.1.0"
edition = "2024"
default-run = "backend_rust"

[dependencies]
rocket = { version = "0.5", features = ["json", "secrets"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
utoipa = { version = "4.2", features = ["rocket_extras", "decimal", "chrono"] }
utoipa-swagger-ui = { version = "6.0", features = ["rocket"] }
rocket_cors = "0.6"
rust_decimal = { version = "1.35", features = ["serde"] }
schemars = "1.0"
openidconnect = "4.1"
rmcp = { version = "3.11.0", features = ["server-side-http", "transport-streamable-http-server", "transport-streamable-http-server-session", "tower", "macros"] }
http = "1.5.0"
http-body-util = "0.1.5"
bytes = "1.12.2"
tower-service = "0.3.3"
