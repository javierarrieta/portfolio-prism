[package]
name = "backend_rust"
version = "0.1.0"
edition = "2024"
default-run = "backend_rust"

[dependencies]
rocket = { version = "0.5", features = ["json", "secrets"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
utoipa = { version = "4.2", features = ["rocket_extras", "decimal", "chrono"] }
utoipa-swagger-ui = { version = "6.0", features = ["rocket"] }
rocket_cors = "0.6"
rust_decimal = { version = "1.35", features = ["serde"] }
schemars = "1.0"
openidconnect = "4.1"
# Already in the tree via rustls/openidconnect, so this adds no new code to the build —
# it only declares the use. Used for the CSPRNG and SHA-256 behind personal access
# tokens (`auth/pat.rs`); the alternative was `rand` + `sha2`, two crates for what one
# already-present crate does.
ring = "0.17"
