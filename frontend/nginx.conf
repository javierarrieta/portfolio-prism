server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compress responses. Nothing was compressed before this block existed: nginx's
    # `gzip_types` defaults to `text/html` alone and `gzip_proxied` defaults to `off`,
    # so the SPA's own JavaScript and a bundle download both left byte for byte. A
    # real export of 1,284,105 bytes gzips to 113,036 -- 11.4x, measured, not
    # estimated -- and the browser still saves a plain `.json`, because
    # `Content-Encoding` is transparent to it and the artifact on disk stays the one
    # you can open and read.
    #
    # `gzip_proxied any` is the line that decides whether this block does anything at
    # all: every response here is either proxied to the backend or served from disk,
    # and with the default `off` only the HTML shell would ever be compressed.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A bundle restore posts the whole file as the request body, and nginx refuses
        # bodies above its default 1 MiB with an HTML page of its own — before the
        # request reaches the backend, so the app has no reason to show and the bundle
        # simply will not import. The backend's own cap is `MAX_BUNDLE_BYTES` in
        # `backend_rust/src/backup/mod.rs` (8 MiB), and a proxy narrower than the
        # server behind it means the app can export a backup its own UI cannot
        # re-import. 12 MiB clears that cap with headroom; the pairing is enforced by
        # `backend_rust/scripts/check_upload_path.sh`, because raising
        # `MAX_BUNDLE_BYTES` alone would silently break this path again.
        client_max_body_size 12m;
    }

    location /api-docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The auth surface (/auth/login, /auth/callback, /auth/logout, /auth/me) lives
    # on the backend, not in the bundle. Without this block the SPA fallback above
    # serves index.html for /auth/login, so a sign-in silently loops back to the
    # app instead of reaching the identity provider.
    location /auth {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
